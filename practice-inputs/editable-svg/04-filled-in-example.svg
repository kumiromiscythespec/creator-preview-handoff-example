<rect x="32" y="147" width="576" height="43" rx="7" fill="#E7F2E9" stroke="#142E3A" stroke-width="1.3"/><text x="46" y="173" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#405B65" letter-spacing="1">PROJECT</text><text x="126" y="175" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142E3A" >A tiny balcony garden</text><text x="32" y="215" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#405B65" letter-spacing="0.8">FIRST SMALL STEP</text><text x="32" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#142E3A" >Plant one mint cutting in a reused pot.</text><line x1="32" y1="246" x2="608" y2="246" stroke="#81969A" stroke-width="1.2"/><text x="32" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#405B65" letter-spacing="0.8">WHAT I ALREADY HAVE</text><text x="32" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#142E3A" >One clean pot, soil and a sunny corner.</text><line x1="32" y1="298" x2="608" y2="298" stroke="#81969A" stroke-width="1.2"/><text x="32" y="319" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#405B65" letter-spacing="0.8">SOMETHING I WOULD CHANGE</text><text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#142E3A" >Put a tray under the pot before watering.</text><line x1="32" y1="350" x2="608" y2="350" stroke="#81969A" stroke-width="1.2"/><text x="32" y="371" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#405B65" letter-spacing="0.8">NEXT CHECK</text><text x="32" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#142E3A" >Check the soil each morning for one week.</text><line x1="32" y1="402" x2="608" y2="402" stroke="#81969A" stroke-width="1.2"/>
